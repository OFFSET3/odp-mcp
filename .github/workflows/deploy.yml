name: Build and Deploy odp-mcp

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  ACR_NAME: aresnetacr
  REGISTRY: aresnetacr.azurecr.io
  IMAGE_NAME: odp-mcp
  RESOURCE_GROUP: rg-offset3
  CONTAINER_APP_NAME: odp-mcp
  CONTAINER_APP_ENV: cae-offset3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Create or update Container App (plain env var)
        run: |
          EXISTS=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "Creating Container App ${{ env.CONTAINER_APP_NAME }}..."
            az containerapp create \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_APP_ENV }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --registry-server ${{ env.REGISTRY }} \
              --target-port 8000 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --env-vars "MCP_SERVER_NAME=USPTO ODP"
          else
            echo "Updating image for Container App ${{ env.CONTAINER_APP_NAME }}..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fi

      - name: Enable system-assigned managed identity
        run: |
          az containerapp identity assign \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --system-assigned

      - name: Grant managed identity access to Key Vault
        run: |
          PRINCIPAL_ID=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "identity.principalId" -o tsv)

          az role assignment create \
            --assignee "$PRINCIPAL_ID" \
            --role "Key Vault Secrets User" \
            --scope "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID || '4c77f152-9b87-4d52-96bc-0c8ba29cd97e' }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.KeyVault/vaults/kv-offset3" \
            || echo "Role assignment already exists"

      - name: Wire Key Vault secret reference
        run: |
          KV_SECRET_URI=$(az keyvault secret show \
            --vault-name kv-offset3 \
            --name uspto-odp-api-key \
            --query "id" -o tsv)

          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets "uspto-api-key=keyvaultref:${KV_SECRET_URI},identityref:system"

          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars "USPTO_API_KEY=secretref:uspto-api-key"

      - name: Print MCP URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "::notice::MCP Server URL: https://${FQDN}/mcp"
          echo "::notice::Health check:   https://${FQDN}/health"
