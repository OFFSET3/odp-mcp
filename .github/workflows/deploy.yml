name: Build and Deploy odp-mcp

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  ACR_NAME: aresnetacr
  REGISTRY: aresnetacr.azurecr.io
  IMAGE_NAME: odp-mcp
  RESOURCE_GROUP: rg-offset3
  CONTAINER_APP_NAME: odp-mcp
  CONTAINER_APP_ENV: cae-offset3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Create or update Container App (plain env var)
        run: |
          EXISTS=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "Creating Container App ${{ env.CONTAINER_APP_NAME }}..."
            az containerapp create \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_APP_ENV }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --registry-server ${{ env.REGISTRY }} \
              --target-port 8000 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --env-vars "MCP_SERVER_NAME=USPTO ODP"
          else
            echo "Updating image for Container App ${{ env.CONTAINER_APP_NAME }}..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fi

      - name: Inject USPTO API keys from Key Vault
        run: |
          # Read credentials using the deployment SP (KV Secrets User role).
          # Mask both values before passing them to Container Apps.
          USPTO_KEY=$(az keyvault secret show \
            --vault-name kv-offset3 \
            --name uspto-odp-api-key \
            --query "value" -o tsv)
          TSDR_KEY=$(az keyvault secret show \
            --vault-name kv-offset3 \
            --name uspto-tsdr-api-key \
            --query "value" -o tsv)

          echo "::add-mask::${USPTO_KEY}"
          echo "::add-mask::${TSDR_KEY}"

          if [ -z "${USPTO_KEY}" ] || [ -z "${TSDR_KEY}" ]; then
            echo "Required USPTO credential missing from Key Vault." >&2
            exit 1
          fi

          # Store credentials as Container App secrets and expose only secret refs.
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "uspto-api-key=${USPTO_KEY}" \
              "uspto-tsdr-api-key=${TSDR_KEY}"

          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              "USPTO_API_KEY=secretref:uspto-api-key" \
              "USPTO_TSDR_API_KEY=secretref:uspto-tsdr-api-key"

          # Azure Container Apps secrets are application-scoped, but updated
          # secret values are not picked up automatically by existing revision
          # replicas. Restart the latest revision so credential rotations take
          # effect immediately even when the secret-ref names are unchanged.
          LATEST_REVISION=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" -o tsv)

          az containerapp revision restart \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "${LATEST_REVISION}"

      - name: Print MCP URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "::notice::MCP Server URL: https://${FQDN}/mcp"
          echo "::notice::Health check:   https://${FQDN}/health"
